<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词小窝">
<meta name="description" content="英语四级背单词：阅读标词、生词本、多场景释义、9 种测验，可离线使用">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>四级单词小窝</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: an editorial study desk — one centred column (max 960px), serif for English words and reading, quiet sans for UI, hairline rules instead of boxes; optional photo background behind frosted panels */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --surface2:#EFEFEB; --ink:#17171A; --ink2:#4A4A52; --muted:#86868F; --line:#E3E3DE;
  --accent:#2E47C2; --accent-soft:#E6EAFB; --mine:#F3DFA6; --mine-ink:#5A4300; --ok:#1E7F55; --ok-soft:#DDF1E7; --bad:#B4441C; --bad-soft:#F8E3DA;
  --glass:rgba(255,255,255,.78);
  --f-serif:"Newsreader","Iowan Old Style","Songti SC","Noto Serif SC","STSong",Georgia,serif;
  --f-sans:"Manrope","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1A1A1D; --surface2:#232327; --ink:#EDEDEF; --ink2:#BDBDC4; --muted:#8B8B94; --line:#2C2C31;
  --accent:#93A5FF; --accent-soft:#1F2647; --mine:#5B4A1B; --mine-ink:#F6DF9E; --ok:#5BD19B; --ok-soft:#173327; --bad:#F09A78; --bad-soft:#3A2119;
  --glass:rgba(26,26,29,.76); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1A1A1D; --surface2:#232327; --ink:#EDEDEF; --ink2:#BDBDC4; --muted:#8B8B94; --line:#2C2C31;
  --accent:#93A5FF; --accent-soft:#1F2647; --mine:#5B4A1B; --mine-ink:#F6DF9E; --ok:#5BD19B; --ok-soft:#173327; --bad:#F09A78; --bad-soft:#3A2119;
  --glass:rgba(26,26,29,.76); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
.serif{font-family:var(--f-serif)}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* background layer */
#bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center}
#veil{position:fixed;inset:0;z-index:-1;background:var(--bg)}
body.has-bg{background:transparent}
body.has-bg .panel,body.has-bg .card,body.has-bg .wli,body.has-bg .paper,body.has-bg .q,body.has-bg .art,body.has-bg .mode,body.has-bg .src,body.has-bg .opt,body.has-bg .mt,body.has-bg .face,body.has-bg .search input{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1)}
body.has-bg .top{background:transparent}
body.has-bg::before{background:transparent}

/* shell */
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font-family:var(--f-serif);font-size:21px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-sans);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink2);font-size:14px}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:25}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 14px;border-radius:12px}
  .tab[aria-current="true"]{background:transparent;color:var(--accent)}
  .top .sync{margin-left:auto}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 13px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:18px}
.seg button{padding:10px 0;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}.pill.mine{background:var(--mine);color:var(--mine-ink)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.toggle{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--surface)}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h3{font-family:var(--f-serif);font-size:22px;color:var(--ink);margin-bottom:6px}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sect h2{font-family:var(--f-serif);font-size:20px;font-weight:600}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:22px}
.hero h1{font-family:var(--f-serif);font-size:clamp(30px,5vw,44px);font-weight:500;letter-spacing:-.02em;margin-top:6px}
.figs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:26px}
.fig{padding:14px 16px;border-left:1px solid var(--line)}
.fig:first-child{border-left:0;padding-left:0}
.fig b{display:block;font-family:var(--f-serif);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.fig span{font-size:12.5px;color:var(--muted)}
@media (max-width:620px){.hero{grid-template-columns:1fr}.figs{grid-template-columns:repeat(2,1fr)}.fig:nth-child(3){border-left:0;padding-left:0}.fig:nth-child(n+3){border-top:1px solid var(--line)}}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.art{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .15s,transform .15s}
.art:hover{border-color:var(--ink2);transform:translateY(-1px)}
.art .no{display:flex;justify-content:space-between;align-items:center}
.art h3{font-family:var(--f-serif);font-size:19px;font-weight:600;letter-spacing:-.005em}
.art p{margin:0;font-size:13.5px;color:var(--muted)}
.art .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* reader */
.back{font-weight:600;color:var(--muted);font-size:14px;display:inline-flex;gap:6px;align-items:center;padding:4px 0;margin-bottom:10px}
.back:hover{color:var(--ink)}
.rhead{max-width:68ch;margin:0 auto 18px}
.rhead h1{font-family:var(--f-serif);font-size:clamp(28px,5vw,40px);font-weight:500;letter-spacing:-.02em;margin:8px 0 6px}
.rtools{max-width:68ch;margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.key{display:inline-flex;gap:14px;align-items:center;color:var(--ink2)}
.k4{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.km{background:var(--mine);color:var(--mine-ink);border-radius:3px;padding:0 3px}
.paper{max-width:68ch;margin:0 auto;font-family:var(--f-serif);font-size:var(--rs,19px);line-height:1.8;background:transparent;border-radius:var(--r)}
body.has-bg .paper{padding:20px 22px;border:1px solid var(--line)}
.paper p{margin:0 0 1.1em}
.paper.m-orig p:first-child::first-letter{font-size:3.1em;float:left;line-height:.9;padding:.08em .08em 0 0;font-weight:500}
.paper .w{cursor:pointer;border-radius:3px;transition:background .12s}
.paper .w:hover{background:var(--surface2)}
.paper .w.c4{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.paper .w.un{background:var(--mine);color:var(--mine-ink);text-decoration:none}
.paper .w.sel{box-shadow:0 0 0 2px var(--accent)}
.hintline{max-width:68ch;margin:0 auto 14px;font-size:13px;color:var(--muted)}
.rlist{max-width:68ch;margin:0 auto}
.tbar{border-top:0;margin-top:-18px;padding-top:6px}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.segc button{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2)}
.segc button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.reader.wide .rhead,.reader.wide .rtools,.reader.wide .hintline,.reader.wide .paper{max-width:none}
.zh{font-family:var(--f-sans);font-size:.8em;line-height:1.8;color:var(--ink2);letter-spacing:.01em;transition:filter .2s}
.pair{margin:0 0 .75em}
.pair .zh{margin-top:.1em;padding-left:.8em;border-left:2px solid var(--line)}
.para{margin-bottom:1.5em}
.prow{display:grid;grid-template-columns:1fr;gap:.45em;margin-bottom:1.3em}
.prow p{margin:0}
.prow .zh{background:var(--surface2);border-radius:10px;padding:.7em .9em}
.fgrid{display:grid;grid-template-columns:1fr;gap:22px}
.fcol p{margin:0 0 1.05em}
.fcol.zh{background:var(--surface2);border-radius:12px;padding:16px 18px}
.fcol .eyebrow{display:block;margin-bottom:10px;font-size:11px}
@media (min-width:860px){
  .prow{grid-template-columns:1fr 1fr;gap:32px}.prow .zh{background:transparent;border-radius:0;padding:0 0 0 22px;border-left:1px solid var(--line)}
  .fgrid{grid-template-columns:1fr 1fr;gap:36px}.fcol.zh{background:transparent;border-radius:0;padding:0 0 0 26px;border-left:1px solid var(--line)}
}
.paper.blur .zh:not(.peek){filter:blur(6px);cursor:pointer;user-select:none;-webkit-user-select:none}
.paper.blur .zh.peek{filter:none}
.trnote{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:var(--f-sans);font-size:14px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin:0 0 18px}
.trnote small{color:var(--muted);flex-basis:100%}
.ocr-tip{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.endbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}

/* word rows */
.wl{display:flex;flex-direction:column}
.wli{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
body.has-bg .wli{padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px}
.wli .wd{font-family:var(--f-serif);font-size:20px;font-weight:600}
.wli .mn{font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wli .cx{font-family:var(--f-serif);font-size:14px;color:var(--muted);margin-top:3px;line-height:1.5}
.cx b,.ex b{color:var(--ink);font-weight:600;background:var(--mine);color:var(--mine-ink);border-radius:3px;padding:0 2px}
.say{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);background:var(--surface)}
.say svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.star{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.star svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed="true"]{background:var(--mine);border-color:transparent;color:var(--mine-ink)}
.star[aria-pressed="true"] svg{fill:currentColor}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}.lvl i{width:6px;height:6px;border-radius:50%;background:var(--line)}.lvl i.on{background:var(--ok)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.32);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(620px,100%);max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));animation:up .2s ease-out;border:1px solid var(--line)}
@media (min-width:761px){.scrim{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
.wh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wh h2{font-family:var(--f-serif);font-size:34px;font-weight:600;letter-spacing:-.01em}
.ph{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.senses{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.sense{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline}
.pos{font-family:var(--f-serif);font-style:italic;color:var(--accent);font-size:14px;font-weight:600}
.blk{padding:14px 0;border-top:1px solid var(--line)}
.blk>.eyebrow{display:block;margin-bottom:8px}
.ex{font-family:var(--f-serif);font-size:15.5px;margin:6px 0;line-height:1.55}
.ex small{display:block;font-family:var(--f-sans);color:var(--muted);font-size:13px}
.ai{border-left:2px solid var(--accent);padding:6px 0 6px 12px;margin:8px 0;white-space:pre-wrap;font-size:14px;color:var(--ink2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1;min-width:130px}

/* scenes */
.scenes{display:flex;flex-direction:column}
.sc{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:12px 0;border-top:1px dashed var(--line)}
.sc:first-child{border-top:0}
.sc .lab{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.sc .lab b{font-size:12px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink)}
.sc .mean{font-weight:700;font-size:14.5px}
.sc .ex{margin:4px 0 0}
.sc .ai-tag{font-size:10px;letter-spacing:.1em;color:var(--accent)}
@media (max-width:520px){.sc{grid-template-columns:1fr;gap:6px}.sc .lab{flex-direction:row;align-items:center}}
.mini-sc{display:flex;flex-wrap:wrap;gap:6px}
.mini-sc span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.mini-sc span em{font-style:normal;color:var(--muted);margin-right:4px;font-size:12px}

/* word page */
.wpage{max-width:760px;margin:0 auto}
.wpage .wh h2{font-size:clamp(40px,8vw,60px);font-weight:500}
.chipw{display:inline-block;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;background:var(--surface)}

/* book */
.bookhead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:18px}
.bookhead h1{font-family:var(--f-serif);font-size:clamp(28px,4.6vw,40px);font-weight:500;letter-spacing:-.02em;margin-top:4px}
.search{margin-bottom:6px}
@media (max-width:620px){.bookhead{grid-template-columns:1fr}}

/* quiz */
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 24px}
.src{padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:13.5px;background:var(--surface)}
.src small{color:var(--muted);font-weight:500;margin-left:6px}
.src[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.src[aria-pressed="true"] small{color:var(--bg);opacity:.7}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mode{text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--surface);transition:border-color .15s,transform .15s;min-height:132px}
.mode:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode .gl{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-serif);font-weight:600;font-size:17px;margin-bottom:6px}
.mode h3{font-size:16px}
.mode p{margin:0;font-size:13px;color:var(--muted)}
.mode.new .gl{background:var(--accent-soft);color:var(--accent)}
.game{max-width:620px;margin:0 auto}
.gbar{display:flex;align-items:center;gap:14px;margin:0 0 20px}
.prog{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.combo{font-weight:700;font-size:13px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 22px;text-align:center}
.q .prompt{font-family:var(--f-serif);font-size:40px;font-weight:500;word-break:break-word;letter-spacing:-.01em}
.q .prompt.cn{font-family:var(--f-sans);font-size:20px;font-weight:700}
.q .sent{font-family:var(--f-serif);font-size:19px;line-height:1.7;text-align:left}
.q .sent u{text-decoration:none;display:inline-block;min-width:84px;border-bottom:2px solid var(--ink)}
.q .sent b{background:var(--mine);color:var(--mine-ink);border-radius:3px;padding:0 3px}
.q .hint{color:var(--muted);font-size:14px;margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:left;min-height:54px;transition:border-color .12s}
.opt:hover{border-color:var(--ink2)}
.opt.en{font-family:var(--f-serif);font-size:19px;text-align:center;font-weight:500}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;text-align:left;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fb .grow{flex:1 1 220px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb b.v{font-size:15px}
.flip{perspective:1200px;cursor:pointer}
.flip-in{position:relative;min-height:300px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:auto}
.face.back{transform:rotateY(180deg);text-align:left;align-items:stretch;justify-content:flex-start}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:58px;font-weight:600;transition:opacity .3s,transform .2s,border-color .12s}
.mt.en{font-family:var(--f-serif);font-size:19px;font-weight:500}
.mt.on{border-color:var(--accent);background:var(--accent-soft)}
.mt.gone{opacity:0;transform:scale(.9);pointer-events:none}
.mt.wrong{animation:shake .3s;border-color:var(--bad)}
.result .big{font-family:var(--f-serif);font-size:64px;font-weight:500;line-height:1;margin:8px 0}
.result .dots{display:flex;gap:6px;justify-content:center;margin:8px 0 2px}
.result .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.result .dots i.on{background:var(--ink)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* me / look */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cal i{aspect-ratio:1;border-radius:3px;background:var(--surface2);max-width:100%}
.cal i.l1{background:color-mix(in srgb,var(--ok) 35%,transparent)}.cal i.l2{background:var(--ok)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:10px 0}
.sw{aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);background-size:cover;background-position:center;position:relative;font-size:11.5px;font-weight:700;display:flex;align-items:flex-end;padding:6px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);max-width:100%}
.sw.none{background:var(--surface2);color:var(--ink2);text-shadow:none}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw.up{background:var(--surface);color:var(--ink2);text-shadow:none;border-style:dashed;align-items:center;justify-content:center;text-align:center}
.range{display:flex;align-items:center;gap:10px;font-size:13px}
.range input{padding:0;border:0;background:transparent;accent-color:var(--accent)}
.drop{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;max-width:90vw;text-align:center;animation:up .2s}
.loading{display:grid;place-items:center;min-height:50vh;text-align:center;color:var(--muted)}
.loading .serif{font-size:26px;color:var(--ink);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <main id="main"><div class="loading"><div><div class="serif">正在准备词库</div><p>四级词汇约 5000 词，第一次打开需要几秒钟</p></div></div></main>
</div>
<canvas id="confetti" hidden></canvas>

<script>window.__OFFLINE=1;window.__OCR_BASE="ocr/";</script>
<script>
"use strict";
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
function dateAfter(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
const dayNum=s=>Math.floor(new Date(s+"T00:00:00").getTime()/864e5);
const docId=w=>"w_"+w.toLowerCase().replace(/[^a-z0-9-]/g,"_");
function toast(t,ms=1900){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const OFFLINE=!!window.__OFFLINE;
const IC={say:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>'};
const CATS=["全部","我的","校园","科技","环境","健康","文化","社会","职场","科学"];
const CATEN={"校园":"Campus","科技":"Tech","环境":"Environment","健康":"Health","文化":"Culture","社会":"Society","职场":"Career","科学":"Science","我的":"Mine"};
async function loadData(n){if(window["__"+n])return window["__"+n];const r=await fetch(n+".json");if(!r.ok)throw new Error(n);return r.json()}


/* ============ state ============ */
const S={cet:null,dict:null,dictP:null,scn:{},aisc:LS.get("cn_aisc",{}),arts:[],mine:[],words:{},meta:{read:[],known:[],xp:0,days:{}},
  view:"home",cat:"全部",showBasic:false,tr:{},trm:LS.get("cn_trm","orig"),trBlur:LS.get("cn_trblur",false),curTr:new Map(),fs:LS.get("cn_fs",19),db:null,base:null,sample:null,imgOK:false,cloud:false,assets:null};
const INTV=[0,1,2,4,7,15,30,60];

/* ============ storage ============ */
function saveLocal(){LS.set("cn_data",{words:S.words,meta:S.meta,mine:S.mine})}
function loadLocal(){const d=LS.get("cn_data",null);if(d){S.words=d.words||{};S.meta=Object.assign(S.meta,d.meta||{});S.mine=d.mine||[]}}
async function cloudSet(path,obj){if(!S.db)return;try{await S.db.doc(S.base+"/"+path).set(obj)}catch(e){console.warn(e);setSync("err")}}
async function cloudDel(path){if(!S.db)return;try{await S.db.doc(S.base+"/"+path).delete()}catch(e){console.warn(e)}}
let metaTimer=0;
function saveMeta(){saveLocal();clearTimeout(metaTimer);metaTimer=setTimeout(()=>cloudSet("meta",{k:"m",...S.meta}),800)}
function putWord(rec){rec.u=Date.now();S.words[rec.w]=rec;saveLocal();cloudSet(docId(rec.w),{k:"w",kl:"w"+rec.w[0],...rec})}
function dropWord(w){delete S.words[w];saveLocal();cloudDel(docId(w))}
function setSync(st){const e=$("#sync");if(!e)return;if(st==="local"&&window.__PWA_READY){e.textContent="已可离线使用";e.title="所有内容已存到这台设备，断网也能打开";return}
  e.textContent=st==="pwa"?"已可离线使用":st==="pwa-wait"?"正在下载离线数据…":st==="cloud"?"已同步 · 手机电脑通用":st==="err"?"同步失败 · 已存本机":"进度保存在本机";
  e.title=st==="cloud"?"登录同一账号，在任何设备打开都能看到你的进度":"进度保存在这个浏览器里，可在「我的」页面导出备份"}

async function initCloud(){
  try{
    if(OFFLINE||!window.claude||!claude.use){setSync("local");return}
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){setSync("local");return}
    S.db=db;S.base="data/users/"+uid;
    const col=db.collection(S.base);
    let snap=await col.where("k","==","w").limit(1000).get();
    let docs=snap.docs;
    if(snap.size>=1000){docs=[];for(const c of "abcdefghijklmnopqrstuvwxyz"){const s=await col.where("kl","==","w"+c).limit(1000).get();docs.push(...s.docs)}}
    const cloudW={};docs.forEach(d=>{const x=d.data();if(x&&x.w){delete x.k;delete x.kl;cloudW[x.w]=x}});
    for(const [w,r] of Object.entries(S.words)){if(!cloudW[w]||(r.u||0)>(cloudW[w].u||0)){cloudW[w]=r;cloudSet(docId(w),{k:"w",kl:"w"+w[0],...r})}}
    S.words=cloudW;
    const m=await db.doc(S.base+"/meta").get();
    if(m.exists){const x=m.data();delete x.k;
      S.meta.read=[...new Set([...(x.read||[]),...S.meta.read])];
      S.meta.known=[...new Set([...(x.known||[]),...S.meta.known])];
      S.meta.xp=Math.max(x.xp||0,S.meta.xp||0);S.meta.days=Object.assign({},x.days||{},S.meta.days);
      if(x.look&&!LS.get("cn_look",null))S.meta.look=x.look;if(x.bgUrl)S.meta.bgUrl=x.bgUrl}
    const as=await col.where("k","==","a").limit(500).get();
    const cm={};as.docs.forEach(d=>{const x=d.data();if(x&&x.id)cm[x.id]=x});
    S.mine.forEach(a=>{if(!cm[a.id]){cm[a.id]=a;cloudSet("a_"+a.id,{k:"a",...a})}});
    S.mine=Object.values(cm).map(a=>{delete a.k;return a}).sort((a,b)=>b.at-a.at);
    const sc=await col.where("k","==","s").limit(1000).get();
    sc.docs.forEach(d=>{const x=d.data();if(x&&x.w&&x.list)S.aisc[x.w]=x.list});LS.set("cn_aisc",S.aisc);
    S.cloud=true;saveLocal();saveMeta();setSync("cloud");if(S.meta.look)LOOK=Object.assign(LOOK,S.meta.look);applyLook();render();
  }catch(e){console.warn("cloud",e);setSync("local")}
}
async function initCaps(){
  if(OFFLINE||!window.claude||!claude.use)return;
  try{const s=await claude.use("sample");if(s){S.sample=s;const lim=await s.limits().catch(()=>null);S.imgOK=!!(lim&&lim.images);S.imgLim=lim&&lim.images}}catch(e){}
  try{S.assets=await claude.use("assets")}catch(e){}
  try{S.dl=await claude.use("downloads")}catch(e){}
  if(S.cet)render();
}

/* ============ dictionary ============ */
function lem(tok){
  const l=tok.toLowerCase().replace(/’/g,"'").replace(/'s$/,"");
  const W=S.cet.w,F=S.cet.f;
  if(W[l])return{w:l,c:1};
  if(F[l])return{w:F[l],c:1};
  const tries=[];
  if(l.endsWith("ies"))tries.push(l.slice(0,-3)+"y");
  if(l.endsWith("ied"))tries.push(l.slice(0,-3)+"y");
  if(l.endsWith("es"))tries.push(l.slice(0,-2));
  if(l.endsWith("s"))tries.push(l.slice(0,-1));
  if(l.endsWith("ed")){tries.push(l.slice(0,-2),l.slice(0,-1));if(/(.)\1ed$/.test(l))tries.push(l.slice(0,-3))}
  if(l.endsWith("ing")){tries.push(l.slice(0,-3),l.slice(0,-3)+"e");if(/(.)\1ing$/.test(l))tries.push(l.slice(0,-4))}
  if(l.endsWith("ly"))tries.push(l.slice(0,-2));
  for(const t of tries)if(W[t])return{w:t,c:1};
  const D=S.dict;
  if(D){if(D.w[l])return{w:l,c:0};if(D.f[l])return{w:D.f[l],c:0};for(const t of tries)if(D.w[t])return{w:t,c:0}}
  return{w:l,c:0};
}
function loadDict(){if(!S.dictP)S.dictP=loadData("dict").then(d=>{S.dict=d;return d}).catch(()=>null);return S.dictP}
function entry(w){const e=S.cet.w[w];if(e)return{...e,cet:1};const d=S.dict&&S.dict.w[w];if(d)return{p:d[0],t:d[1].split("\n").map(x=>{const m=x.match(/^([a-z]+\.)\s*(.*)$/);return m?[m[1],m[2]]:["",x]}),cet:0};return null}
function shortMean(w,n=22){const e=entry(w);if(!e||!e.t||!e.t.length)return"";const s=e.t.map(([p,m])=>(p?p+" ":"")+m.split(/[,，;；]/).slice(0,2).join("，")).slice(0,2).join("；");return s.length>n?s.slice(0,n)+"…":s}
function firstMean(w){const e=entry(w);if(!e)return"";const [p,m]=e.t[0];return (p?p+" ":"")+m.split(/[,，;；]/).slice(0,3).join("，")}
function scenesOf(w){return [...(S.scn[w]||[]).map(x=>({s:x[0],p:x[1],m:x[2],en:x[3],cn:x[4]})),...(S.aisc[w]||[]).map(x=>({...x,ai:1}))]}
let voice=null;
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.92;if(!voice){voice=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang))||null}if(voice)u.voice=voice;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("此设备暂不支持朗读")}}
const canSpeak=()=>"speechSynthesis" in window;
function isCore(w){const e=S.cet.w[w];return e&&!e.b}
function isKnown(w){return S.meta.known.includes(w)}
function hiSent(s,f){const k=String(f||"").replace(/[^A-Za-z'-]/g,"");if(!k)return esc(s);return esc(s).replace(new RegExp("\\b("+k+"[a-z]*)\\b","i"),"<b>$1</b>")}

/* ============ sounds & confetti ============ */
let actx=null;
function beep(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime;o.type="sine";o.frequency.setValueAtTime(ok?740:240,t);if(ok)o.frequency.setValueAtTime(988,t+.08);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.26);o.start(t);o.stop(t+.28)}catch(e){}}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#confetti");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const st=getComputedStyle(document.documentElement);const cols=[st.getPropertyValue("--accent"),st.getPropertyValue("--ok"),st.getPropertyValue("--ink"),st.getPropertyValue("--mine")];
  const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,r:3+Math.random()*4,c:pick(cols),vy:2+Math.random()*2.5,vx:-.8+Math.random()*1.6,a:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.08;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/3,p.r*2,p.r/1.5);x.restore()});if(++n<150)requestAnimationFrame(f);else c.hidden=true})()}

/* ============ look / background ============ */
const PRESETS={mist:["雾灰","linear-gradient(160deg,#dfe3e8 0%,#f3f4f6 45%,#cfd6de 100%)"],dawn:["晨光","linear-gradient(135deg,#f6dcc4 0%,#efd0d4 45%,#d3dcf2 100%)"],
  pine:["松林","linear-gradient(150deg,#d6e2d5 0%,#b2c7b5 55%,#8aa794 100%)"],dusk:["暮紫","linear-gradient(150deg,#e6e0f3 0%,#c9c0e6 50%,#a9aedb 100%)"],
  ocean:["深海","linear-gradient(160deg,#0f2027 0%,#203a43 50%,#2c5364 100%)"],ink:["墨色","radial-gradient(120% 90% at 20% 10%,#3a3a44 0%,#16161a 70%)"]};
let LOOK=Object.assign({src:"none",veil:.55,on:{book:true,reader:false,quiz:false,home:false}},LS.get("cn_look",{}));
let BGIMG=LS.get("cn_bgimg",null);
function saveLook(){LS.set("cn_look",LOOK);if(S.cloud){S.meta.look=LOOK;saveMeta()}}
function areaOf(v){return v==="reader"?"reader":v==="book"||v==="word"?"book":v==="quiz"||v==="game"?"quiz":"home"}
function applyLook(){
  const bg=$("#bg"),veil=$("#veil");let img=null;
  if(LOOK.src==="img")img=BGIMG?`url("${BGIMG}")`:(S.meta.bgUrl?`url("${S.meta.bgUrl}")`:null);
  else if(PRESETS[LOOK.src])img=PRESETS[LOOK.src][1];
  const on=img&&LOOK.on[areaOf(S.view)];
  document.body.classList.toggle("has-bg",!!on);
  bg.style.backgroundImage=on?img:"none";veil.hidden=!on;veil.style.opacity=LOOK.veil;
}

/* ============ day / xp ============ */
function touchDay(xp=0){const t=today();S.meta.days[t]=(S.meta.days[t]||0)+Math.max(1,xp);S.meta.xp=(S.meta.xp||0)+xp;saveMeta()}
function streak(){let n=0;const d=new Date();if(!S.meta.days[today()])d.setDate(d.getDate()-1);for(;;){if(S.meta.days[ymd(d)]){n++;d.setDate(d.getDate()-1)}else break}return n}
function dueList(){const t=today();return Object.values(S.words).filter(r=>!r.m&&(r.due||t)<=t)}

/* ============ word records ============ */
function addWord(w,ctx){let r=S.words[w];if(!r){r={w,at:Date.now(),box:0,due:today(),ok:0,bad:0,ctx:[]}}
  if(ctx&&ctx.s&&!r.ctx.some(c=>c.s===ctx.s)){r.ctx=[ctx,...r.ctx].slice(0,4)}
  putWord(r);return r}
function grade(w,q){const r=S.words[w];if(!r)return;if(q===2){r.box=Math.min(r.box+1,INTV.length-1);r.ok++}else if(q===1){r.box=Math.max(1,r.box)}else{r.box=0;r.bad++}
  r.due=dateAfter(q===0?0:INTV[r.box]);r.m=r.box>=6;putWord(r)}

/* ============ routing ============ */
let cur={};
function go(v,p={}){S.view=v;cur=p;render();window.scrollTo(0,0)}
function render(){if(!S.cet)return;
  $$(".tab").forEach(t=>t.setAttribute("aria-current",String(t.dataset.v===S.view||(S.view==="reader"&&t.dataset.v==="home")||(S.view==="game"&&t.dataset.v==="quiz")||(S.view==="word"&&t.dataset.v==="book"))));
  applyLook();const m=$("#main");({home:vHome,reader:vReader,book:vBook,word:vWord,quiz:vQuiz,game:vGame,me:vMe}[S.view]||vHome)(m)}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b){stopGame();go(b.dataset.v)}});

/* ============ HOME ============ */
function allArts(){return [...S.mine.map(a=>({...a,c:"我的"})),...S.arts]}
const artN={};

/* ============ READER ============ */
function findArt(id){return allArts().find(a=>String(a.id)===String(id))}
const ABBR=/\b(?:Mr|Mrs|Ms|Dr|St|Prof|etc|vs|e\.g|i\.e|a\.m|p\.m|U\.S|U\.K|No)[.]$/;
function splitSent(p){const out=[];let last=0,m;const re=/[.!?。！？]+["'”’)]*(\s+|$)/g;
  while((m=re.exec(p))){const end=m.index+m[0].length;const nxt=p.slice(end);
    if(m[1]===""||(/^["'“‘(]?[A-Z0-9]/.test(nxt)&&!ABBR.test(p.slice(0,m.index+1)))){out.push(p.slice(last,end));last=end}
    if(m[0].length===0)re.lastIndex++;if(end>=p.length)break}
  if(last<p.length)out.push(p.slice(last));return out.length?out:[p]}
function parasOf(b){return b.split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function trOf(a){const t=String(a.id).startsWith("m")?(S.mine.find(x=>x.id===a.id)||{}).tr:S.tr[String(a.id)];return Array.isArray(t)?t:null}
const TRM=[["orig","原文"],["sent","逐句"],["para","逐段"],["full","全文"]];
function vReader(m){
  const a=findArt(cur.id);if(!a){go("home");return}
  loadDict();
  const mode=S.trm||"orig",tr=trOf(a);
  const P=parasOf(a.b).map((p,pi)=>{const ss=splitSent(p);const t=tr&&tr[pi];return{ss,zh:t&&t.length===ss.length?t:null,zhp:t?t.join(""):""}});
  S.curTr=new Map();P.forEach(x=>x.zh&&x.ss.forEach((e,i)=>S.curTr.set(e.trim(),x.zh[i])));
  const mark=s=>`<span class="s">`+esc(s).replace(/[A-Za-z][A-Za-z'’]*/g,t=>{const x=lem(t);
      let cls="w";if(S.words[x.w])cls+=" un";else if(x.c&&!isKnown(x.w)&&(isCore(x.w)||S.showBasic))cls+=" c4";
      return `<span class="${cls}" data-l="${esc(x.w)}">${t}</span>`})+"</span>";
  const eff=tr?mode:"orig";let html;
  if(eff==="sent")html=P.map(x=>`<div class="para">${x.ss.map((e,i)=>`<div class="pair">${mark(e)}${x.zh?`<div class="zh">${esc(x.zh[i])}</div>`:""}</div>`).join("")}${!x.zh&&x.zhp?`<div class="zh">${esc(x.zhp)}</div>`:""}</div>`).join("");
  else if(eff==="para")html=P.map(x=>`<div class="prow"><p class="en">${x.ss.map(mark).join("")}</p><p class="zh">${esc(x.zhp)}</p></div>`).join("");
  else if(eff==="full")html=`<div class="fgrid"><div class="fcol en">${P.map(x=>`<p>${x.ss.map(mark).join("")}</p>`).join("")}</div><div class="fcol zh"><span class="eyebrow">全文翻译</span>${P.map(x=>`<p>${esc(x.zhp)}</p>`).join("")}</div></div>`;
  else html=P.map(x=>"<p>"+x.ss.map(mark).join("")+"</p>").join("");
  const own=String(a.id).startsWith("m");
  const note=mode!=="orig"&&!tr?`<div class="trnote"><span class="grow">这篇是你自己添加的文章，还没有中文翻译。</span><button class="btn sm pri" id="doTr">翻译这篇文章</button><small>需要联网，翻译一次后会保存下来，之后离线也能看。</small></div>`:"";
  const hint=eff==="orig"?"点任意单词查看释义和不同场景的用法；不认识的点「加入生词本」，它会被标成黄色。":"英文里的单词照样可以点。打开「遮住中文」后，先自己理解，再点中文核对。";
  m.innerHTML=`<div class="reader ${eff==="para"||eff==="full"?"wide":""}"><button class="back" id="bk">← 文章列表</button>
  <header class="rhead"><div class="eyebrow">${esc(CATEN[a.c]||"")} · ${esc(a.c)} · ${a.b.split(/\s+/).length} words</div><h1>${esc(a.t)}</h1><p class="muted" style="margin:0">${esc(a.tc||"")}</p></header>
  <div class="rtools"><span class="key"><span class="k4">四级词汇</span><span class="km">我的生词</span></span><span class="grow"></span>
    <button class="toggle" id="basic" aria-pressed="${S.showBasic}" title="同时标出初高中已学过的四级基础词">含基础词</button>
    <button class="toggle" id="fsm" aria-label="缩小字号">A−</button><button class="toggle" id="fsp" aria-label="放大字号">A+</button>
    ${own?'<button class="toggle" id="delA">删除</button>':""}</div>
  <div class="rtools tbar"><span class="eyebrow">中文对照</span><span class="segc" role="group" aria-label="翻译显示方式">${TRM.map(([k,l])=>`<button data-trm="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</span>

  <div class="rlist" id="wlist"></div></div>`;
  $("#bk").onclick=()=>go("home");
  $("#basic").onclick=()=>{S.showBasic=!S.showBasic;render()};
  $$("[data-trm]",m).forEach(b=>b.onclick=()=>{S.trm=b.dataset.trm;LS.set("cn_trm",S.trm);const y=scrollY;render();scrollTo(0,y)});
  const bt=$("#blurT");if(bt)bt.onclick=()=>{S.trBlur=!S.trBlur;LS.set("cn_trblur",S.trBlur);bt.setAttribute("aria-pressed",S.trBlur);$("#paper").classList.toggle("blur",S.trBlur);$$("#paper .zh.peek").forEach(z=>z.classList.remove("peek"))};
  const dt=$("#doTr");if(dt)dt.onclick=()=>translateArticle(a,dt);
  $("#fsm").onclick=()=>{S.fs=Math.max(15,S.fs-1);LS.set("cn_fs",S.fs);$("#paper").style.setProperty("--rs",S.fs+"px")};
  $("#fsp").onclick=()=>{S.fs=Math.min(26,S.fs+1);LS.set("cn_fs",S.fs);$("#paper").style.setProperty("--rs",S.fs+"px")};
  if($("#delA"))$("#delA").onclick=()=>confirmSheet("删除这篇文章？","生词本里的单词会保留。",()=>{S.mine=S.mine.filter(x=>String(x.id)!==String(a.id));saveLocal();cloudDel("a_"+a.id);go("home")});
  $("#paper").onclick=async e=>{const z=e.target.closest(".zh");if(z&&S.trBlur){z.classList.toggle("peek");return}
    const w=e.target.closest(".w");if(!w)return;$$(".w.sel").forEach(x=>x.classList.remove("sel"));w.classList.add("sel");
    const sent=w.closest(".s").textContent.trim();if(!S.dict&&!S.cet.w[w.dataset.l]){await loadDict();w.dataset.l=lem(w.textContent).w}
    wordSheet(w.dataset.l,{s:sent,zh:S.curTr.get(sent),form:w.textContent,aid:String(a.id),at:a.t})};
  renderArtList(a);
}
async function translateArticle(a,btn){
  const orig=S.mine.find(x=>x.id===a.id);if(!orig)return;
  const P=parasOf(a.b).map(splitSent);const total=P.reduce((n,x)=>n+x.length,0);
  btn.disabled=true;btn.textContent="正在翻译…";
  try{let out;
    if(S.sample){
      const prompt=`把下面这篇英文文章翻译成自然、准确的简体中文，供中国大学生备考英语四级时对照阅读。输入是一个 JSON 数组：每个元素代表一个段落，段落里是逐个句子。请逐句翻译，返回结构完全相同的 JSON 数组（段落数、每段句子数都必须一致），只返回 JSON。\n${JSON.stringify(P.map(x=>x.map(y=>y.trim())))}`;
      out=await S.sample.json(prompt,{modelTier:"default"});
      if(!Array.isArray(out)||out.length!==P.length||out.some((x,i)=>!Array.isArray(x)||x.length!==P[i].length))throw{code:"shape"};
      out=out.map(x=>x.map(String));
    }else{
      let done=0;out=P.map(x=>x.map(()=>""));const jobs=[];P.forEach((x,pi)=>x.forEach((e,si)=>jobs.push([pi,si,e.trim()])));
      const run=async()=>{while(jobs.length){const [pi,si,e]=jobs.shift();out[pi][si]=await mmTranslate(e);done++;btn.textContent=`正在翻译… ${done}/${total}`}};
      await Promise.all([run(),run(),run()]);
    }
    orig.tr=out;saveLocal();cloudSet("a_"+orig.id,{k:"a",...orig});toast("翻译完成，已保存");render();
  }catch(e){console.warn(e);btn.disabled=false;btn.textContent="重新翻译";
    toast(e&&e.code==="quota"?"今天的免费翻译额度已用完，明天再试":e&&e.code==="not_granted"?"需要允许页面使用 Claude":"翻译失败：请检查网络后重试",2600)}
}
async function mmTranslate(text){
  const chunks=[];let rest=text;while(rest.length>450){let k=rest.lastIndexOf(", ",450);if(k<100)k=rest.lastIndexOf(" ",450);chunks.push(rest.slice(0,k+1));rest=rest.slice(k+1)}chunks.push(rest);
  const res=[];for(const c of chunks){const r=await fetch("https://api.mymemory.translated.net/get?langpair=en|zh-CN&q="+encodeURIComponent(c));if(!r.ok)throw{code:"net"};
    const d=await r.json();const tt=String((d.responseData||{}).translatedText||"").trim();if(d.quotaFinished||d.responseStatus==429||/^MYMEMORY WARNING/i.test(tt))throw{code:"quota"};if(d.responseStatus!=200||/LIMIT EXCEEDED|INVALID/i.test(tt))throw{code:"api"};res.push(tt)}
  return res.join("")}
function artWords(){const core=new Map(),mine=new Map();
  $$("#paper .w").forEach(el=>{const w=el.dataset.l,s=el.closest(".s").textContent.trim(),f=el.textContent;
    const zh=S.curTr&&S.curTr.get(s);if(S.words[w]){if(!mine.has(w))mine.set(w,{s,f,zh})}else if(el.classList.contains("c4")&&!core.has(w))core.set(w,{s,f,zh})});return{core,mine}}
function wordRow(w,o,inBook){const e=entry(w)||{};return `<div class="wli"><button class="say" data-say="${esc(w)}" aria-label="朗读 ${esc(w)}">${IC.say}</button>
    <div class="grow" data-open="${esc(w)}" style="cursor:pointer"><span class="wd">${esc(w)}</span> <span class="ph">${e.p?"/"+esc(e.p)+"/":""}</span>${S.scn[w]?' <span class="pill acc">多场景</span>':""}
    <div class="mn">${esc(shortMean(w,44))}</div>${o&&o.s?`<div class="cx">${hiSent(o.s,o.f||w)}</div>`:""}</div>
    <button class="star" aria-pressed="${inBook}" data-star="${esc(w)}" data-s="${esc(o?o.s:"")}" aria-label="${inBook?"移出生词本":"加入生词本"}">${IC.star}</button></div>`}
function renderArtList(a){
  const {core,mine}=artWords(),box=$("#wlist");if(!box)return;
  const all=[...mine.keys(),...core.keys()];
  box.innerHTML=`<div class="sect"><h2>本文单词表</h2><span class="muted" style="font-size:13px">${all.length} 个词</span></div>
  ${mine.size?`<div class="eyebrow" style="margin:6px 0 2px">我的生词 · ${mine.size}</div><div class="wl">${[...mine].map(([w,o])=>wordRow(w,o,true)).join("")}</div>`:""}
  ${core.size?`<div class="eyebrow" style="margin:18px 0 2px">本文四级词汇 · ${core.size}</div><div class="wl">${[...core].map(([w,o])=>wordRow(w,o,false)).join("")}</div>`:""}
  ${!all.length?'<div class="empty"><h3>这篇的四级词你都认识了</h3></div>':""}
  <div class="endbar">${core.size?`<button class="btn" id="addAll">四级词全部加入生词本</button>`:""}
    ${all.length>=4?`<button class="btn acc" id="qz">用本文单词做测验</button>`:""}
    <button class="btn pri" id="rd">${S.meta.read.includes(String(a.id))?"已读完":"标记为已读"}</button></div>`;
  bindRows(box,w=>{const o=core.get(w)||mine.get(w);return{s:o.s,zh:o.zh,form:o.f,aid:String(a.id),at:a.t}},()=>{refreshMarks();renderArtList(a)});

  const qz=$("#qz");if(qz)qz.onclick=()=>{S.quizSrc={k:"art",id:String(a.id),words:all};go("quiz",{src:"art"})};
  $("#rd").onclick=()=>{if(!S.meta.read.includes(String(a.id))){S.meta.read.push(String(a.id));touchDay(10);toast("读完一篇，+10 经验");confetti()}renderArtList(a)};
}
function bindRows(box,ctxOf,after){
  $$("[data-say]",box).forEach(b=>b.onclick=()=>speak(b.dataset.say));
  $$("[data-open]",box).forEach(b=>b.onclick=()=>wordSheet(b.dataset.open,ctxOf?ctxOf(b.dataset.open):null));
  $$("[data-star]",box).forEach(b=>b.onclick=()=>{const w=b.dataset.star;if(S.words[w]){dropWord(w);toast("已移出生词本")}else{const c=ctxOf?ctxOf(w):null;addWord(w,c&&c.s?{s:c.s,zh:c.zh,aid:c.aid,at:c.at}:null);toast("已加入生词本")}after&&after()});

function refreshMarks(){$$("#paper .w").forEach(el=>{const w=el.dataset.l;el.classList.toggle("un",!!S.words[w]);const x=S.cet.w[w];el.classList.toggle("c4",!S.words[w]&&!!x&&!isKnown(w)&&(!x.b||S.showBasic))})}

function senseHTML(e){if(!e||!e.t)return"";return `<div class="senses">${e.t.map(([p,m])=>`<div class="sense"><span class="pos">${esc(p||"—")}</span><span>${esc(m)}</span></div>`).join("")}</div>`}

function confirmSheet(t,d,yes){const s=openSheet(`<h2 class="serif" style="font-size:24px">${esc(t)}</h2><p class="muted">${esc(d)}</p><div class="acts"><button class="btn" id="no">取消</button><button class="btn pri" id="yes">确定</button></div>`);

   ${sc.length?`<div class="blk"><span class="eyebrow">不同场景下的意思 · ${sc.length}</span>${scenesHTML(w,false)}</div>`:""}
   ${e&&e.e?`<div class="blk"><span class="eyebrow">例句</span>${e.e.slice(0,2).map(x=>`<div class="ex">${hiSent(x[0],w)}<small>${esc(x[1])}</small></div>`).join("")}</div>`:""}
   <div class="acts">
     <button class="btn ${inB?"":"pri"}" id="tg">${inB?"已在生词本 · 点击移出":"加入生词本"}</button>
     ${e&&e.cet?`<button class="btn" id="kn">${kn?"取消「认识」":"我认识"}</button>`:""}
     <button class="btn" id="dt">完整词卡 →</button></div>`);
  $("#sy",s).onclick=()=>speak(w);
  $("#tg",s).onclick=()=>{if(S.words[w]){dropWord(w);toast("已移出")}else{addWord(w,ctx&&ctx.s?{s:ctx.s,zh:ctx.zh,aid:ctx.aid,at:ctx.at}:null);toast("已加入生词本")}closeSheet();afterChange()};
  const knb=$("#kn",s);if(knb)knb.onclick=()=>{if(kn)S.meta.known=S.meta.known.filter(x=>x!==w);else S.meta.known.push(w);saveMeta();toast(kn?"已恢复标注":"好的，不再标出这个词");closeSheet();afterChange()};

}
function afterChange(){if(S.view==="reader"){refreshMarks();const a=findArt(cur.id);if(a)renderArtList(a)}else render()}
async function aiExplain(w,ctx,out,btn){
  btn.disabled=true;out.className="ai";out.textContent="思考中…";
  const prompt=`你是给中国大学生备考英语四级的老师。句子："${ctx.s}"\n请解释单词 "${ctx.form||w}"（原形 ${w}）在这句话里的具体含义。\n严格按以下格式用中文回答，不要多余内容：\n词性与含义：……\n为什么是这个意思：（一句话）\n这句话翻译：……\n再给一个同义用法的英文例句及中文翻译。`;
  try{const r=await S.sample(prompt,{modelTier:"quick",onText:({text})=>{out.textContent=text}});out.textContent=r.text;

let ocrW=null,ocrWP=null,ocrSt=null;
function loadScript(src){return new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
const OCR_STEP={"loading tesseract core":"加载识别引擎","initializing tesseract":"启动识别引擎","loading language traineddata":"加载英文模型","initializing api":"准备就绪","recognizing text":"识别中"};
function getOcr(){if(ocrW)return Promise.resolve(ocrW);if(ocrWP)return ocrWP;
  ocrWP=(async()=>{const base=ocrBase();
    if(!window.Tesseract)await loadScript(base?base+"tesseract.min.js":"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    const opt={logger:m=>{if(!ocrSt)return;const n=OCR_STEP[m.status];if(n)ocrSt.textContent=n+(m.progress&&m.progress<1?" "+Math.round(m.progress*100)+"%":"…")}};
    if(base)Object.assign(opt,{workerPath:base+"worker.min.js",corePath:base,langPath:base+"lang",workerBlobURL:false,cacheMethod:"none"});
    ocrW=await Tesseract.createWorker("eng",1,opt);return ocrW})();
  ocrWP.catch(()=>{ocrWP=null});return ocrWP}
function prepImage(file){return new Promise((ok,no)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(u);const w=img.naturalWidth,h=img.naturalHeight,L=Math.max(w,h);const k=L>2600?2600/L:L<1400?1400/L:1;
    const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);
    try{const d=x.getImageData(0,0,c.width,c.height),p=d.data,hist=new Uint32Array(256);
      for(let i=0;i<p.length;i+=4){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=g;hist[g]++}
      const n=p.length/4;let lo=0,hi=255,acc=0;for(;lo<255;lo++){acc+=hist[lo];if(acc>n*.02)break}acc=0;for(;hi>0;hi--){acc+=hist[hi];if(acc>n*.02)break}
      const span=Math.max(40,hi-lo);for(let i=0;i<p.length;i+=4){let v=(p[i]-lo)*255/span;v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v}
      x.putImageData(d,0,0)}catch(e){}
    ok(c)};img.onerror=()=>{URL.revokeObjectURL(u);no(new Error("bad image"))};img.src=u})}
function cleanOCR(t){return t.replace(/-\n(?=[a-z])/g,"").split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g," ").replace(/[|_~]+/g,"").replace(/\s{2,}/g," ").trim()).filter(p=>/[A-Za-z]{2}/.test(p)&&(p.match(/[A-Za-z]/g)||[]).length>=p.length*.5).join("\n\n")}
async function localOCR(files,st){ocrSt=st;st.textContent="正在启动识别引擎…";const w=await getOcr();const all=[];
  for(let i=0;i<files.length;i++){if(files.length>1)st.textContent=`识别第 ${i+1}/${files.length} 张…`;const cv=await prepImage(files[i]);const r=await w.recognize(cv);all.push(cleanOCR(r.data.text))}
  ocrSt=null;return all.filter(Boolean).join("\n\n").trim()}
function shrink(f,max=1800,q=.88){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||f)},"image/jpeg",q)};img.onerror=()=>res(f);img.src=u})}

function distract(w,n=3,kind="w"){const e=S.cet.w[w];const pos=e&&e.t[0]?e.t[0][0]:"";
  let pool=Object.keys(S.cet.w).filter(x=>x!==w&&!S.cet.w[x].b&&S.cet.w[x].t[0]&&S.cet.w[x].t[0][0]===pos);
  if(pool.length<20)pool=Object.keys(S.cet.w).filter(x=>x!==w&&!S.cet.w[x].b);
  const out=new Set();const fm=firstMean(w);while(out.size<n){const x=pick(pool);if(kind==="m"&&firstMean(x)===fm)continue;out.add(x)}return[...out]}
function vGame(m){
  if(!G){go("quiz");return}

  ({flash:gFlash,en2cn:gChoice,cn2en:gChoice,cloze:gCloze,spell:gSpell,listen:gChoice,exam:gExam,scene:gScene})[G.mode](m,w,bar);
  $("#qx").onclick=()=>{stopGame();go("quiz")};
}

  beep(ok);if(S.words[w]){const r=S.words[w];if(ok){r.ok++;if((r.due||today())<=today())grade(w,2);else putWord(r)}else grade(w,0)}}
function nextBtn(box,w,ok,extra="",ans=null){box.innerHTML=`<div class="fb ${ok?"ok":"no"}"><b class="v">${ok?pick(["正确","答对了","很好"]):"再想想"}</b>

function clozeSentence(w){const r=S.words[w];const forms=[w,...Object.entries(S.cet.f).filter(([f,l])=>l===w).map(([f])=>f)];
  const cands=[...(r&&r.ctx?r.ctx.map(c=>[c.s,""]):[]),...((S.cet.w[w]||{}).e||[]),...scenesOf(w).map(x=>[x.en,x.cn])];
  for(const [s,cn] of shuffle(cands)){for(const f of forms.sort((a,b)=>b.length-a.length)){const re=new RegExp("\\b"+f+"\\b","i");if(re.test(s)&&s.split(" ").length>3)return{s,cn,f:s.match(re)[0]}}}return null}

function vMe(m){
  const days=[];for(let i=55;i>=0;i--){const d=dateAfter(-i);days.push([d,S.meta.days[d]||0])}
  const ws=Object.values(S.words),mast=ws.filter(r=>r.m).length,core=Object.values(S.cet.w).filter(x=>!x.b).length;
  const seen=new Set([...Object.keys(S.words),...S.meta.known].filter(w=>isCore(w))).size;
  m.innerHTML=`<div class="eyebrow">Profile</div><h1 class="serif" style="font-size:clamp(28px,4.6vw,40px);font-weight:500;letter-spacing:-.02em;margin:4px 0 18px">我的学习</h1>
  <section class="figs"><div class="fig"><b>${S.meta.xp||0}</b><span>总经验</span></div><div class="fig"><b>${mast}</b><span>已掌握</span></div>
   <div class="fig"><b>${streak()}</b><span>连续天数</span></div><div class="fig"><b>${S.meta.read.length}</b><span>读完文章</span></div></section>
  <div class="grid2">
   <div class="panel"><div class="eyebrow">四级核心词进度</div><div class="bar"><i style="width:${seen/core*100}%"></i></div>
     <p class="muted" style="margin:0;font-size:13px">已接触 ${seen} / ${core} 个核心词。收进生词本或标记「认识」都算。词库另含 ${Object.keys(S.cet.w).length-core} 个中学基础词，其中 ${Object.keys(S.scn).length} 个高频多义词配有分场景释义。</p></div>
   <div class="panel"><div class="eyebrow" style="margin-bottom:10px">最近 8 周</div><div class="cal" aria-label="学习日历">${days.map(([d,v])=>`<i class="${v>=30?"l2":v?"l1":""}" title="${d}：${v} 经验"></i>`).join("")}</div></div>
  </div>
  <div class="panel" style="margin-top:14px"><h3 class="serif" style="font-size:20px;margin-bottom:4px">外观与背景</h3><p class="muted" style="margin:0 0 12px;font-size:13.5px">背景图${S.assets?"会同步到你的其他设备":"保存在这个浏览器里"}。</p><div id="lookBox">${lookPanel()}</div>
   <div class="row" style="margin-top:14px"><button class="btn sm" id="th">切换深浅色</button></div></div>
  <div class="panel" style="margin-top:14px"><h3 class="serif" style="font-size:20px;margin-bottom:4px">数据与备份</h3>
   <p class="muted" style="margin:0 0 12px;font-size:13.5px">${S.cloud?"生词本、阅读记录和你添加的文章保存在云端，登录同一账号就能在手机和电脑之间同步。":"进度保存在这个浏览器里，不需要任何账号。清理浏览器数据会丢失进度，建议隔一段时间导出备份；换设备时导出备份，在新设备上导入即可。"}</p>
   <div class="row"><button class="btn sm" id="ex">导出进度备份</button><label class="btn sm" for="im">导入备份</label><input type="file" id="im" accept=".json,application/json" hidden>
    <button class="btn sm ghost" id="rk">清空「我认识」标记（${S.meta.known.length}）</button></div></div>
  <p class="muted" style="font-size:12px;margin-top:20px">词库来源：开源四级词表（kajweb/dict、KyleBing/english-vocabulary）与 ECDICT 英汉词典整理，共 ${Object.keys(S.cet.w).length} 词，含例句、真题原句、搭配与记忆提示。</p>`;
  const lb=$("#lookBox");const rl=()=>{lb.innerHTML=lookPanel();bindLook(lb,rl)};bindLook(lb,rl);
  $("#th").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";LS.set("cn_theme",r.dataset.theme)};
  $("#rk").onclick=()=>confirmSheet("清空「我认识」标记？","这些词会重新在文章里标出来。",()=>{S.meta.known=[];saveMeta();render()});
  $("#ex").onclick=()=>{const blob=new Blob([JSON.stringify({app:"cet4nest",v:2,at:Date.now(),words:S.words,meta:S.meta,mine:S.mine,aisc:S.aisc})],{type:"application/json"});
    const fn="四级单词小窝备份-"+today()+".json";
    if(S.dl){S.dl.save({filename:fn,data:blob}).then(()=>toast("备份文件已保存")).catch(()=>toast("没有保存备份"));return}
    if(!OFFLINE){toast("当前打开方式不支持导出文件");return}
    try{const file=new File([blob],fn,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:fn}).then(()=>toast("备份已导出")).catch(()=>{});return}}catch(e){}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast("备份文件已生成")};
  $("#im").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=="cet4nest")throw 0;
      for(const [w,r] of Object.entries(d.words||{}))if(!S.words[w]||(r.u||0)>(S.words[w].u||0))putWord(r);
      const mm=d.meta||{};S.meta.read=[...new Set([...S.meta.read,...(mm.read||[])])];S.meta.known=[...new Set([...S.meta.known,...(mm.known||[])])];
      S.meta.xp=Math.max(S.meta.xp||0,mm.xp||0);S.meta.days=Object.assign({},mm.days||{},S.meta.days);
      const ids=new Set(S.mine.map(a=>a.id));(d.mine||[]).forEach(a=>{if(!ids.has(a.id)){S.mine.push(a);cloudSet("a_"+a.id,{k:"a",...a})}});S.mine.sort((a,b)=>b.at-a.at);
      if(d.aisc){S.aisc=Object.assign({},d.aisc,S.aisc);LS.set("cn_aisc",S.aisc)}
      saveLocal();saveMeta();toast("导入完成，已和现有进度合并");render()}catch(e){toast("这不是有效的备份文件")}};
}

/* ============ boot ============ */
(async function boot(){
  const th=LS.get("cn_theme",null);if(th)document.documentElement.dataset.theme=th;
  loadLocal();applyLook();
  initCloud();initCaps();
  try{const [c,a,s,t]=await Promise.all([loadData("cet4"),loadData("articles"),loadData("scenes").catch(()=>({})),loadData("translations").catch(()=>({}))]);S.cet=c;S.arts=a;S.scn=s||{};S.tr=t||{};}
  catch(e){$("#main").innerHTML='<div class="empty"><h3>词库加载失败</h3><p>请检查网络后刷新页面。</p></div>';return}
  render();setTimeout(loadDict,1200);
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",async()=>{try{
  const reg=await navigator.serviceWorker.register("sw.js");
  const check=async()=>{try{const ks=await caches.keys();for(const k of ks){const c=await caches.open(k);if(await c.match("dict.json")&&await c.match("cet4.json")){window.__PWA_READY=1;setSync("pwa");return true}}}catch(e){}return false};
  if(!(await check())){setSync("pwa-wait");navigator.serviceWorker.ready.then(()=>{let n=0;const t=setInterval(async()=>{if(await check()||++n>60)clearInterval(t)},1000)})}
  reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("内容已更新，下次打开生效",3000)})});
}catch(e){console.warn(e)}})}
</script>
</body>
</html>
